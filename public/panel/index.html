<!DOCTYPE html>
<head>
    <title>Source Spotify Link Panel</title>
    <script src="js/page-modification.js" defer></script>
    <link rel="stylesheet" href="style/universal.css">
</head>
<body>
    <div class="source-fl-container">
        <div id="authBox" class="flex-container">
            <h1>Authorization</h1>
            <p id="connectStatus">Not connected.</p>
            <button id="spotGetAuth" class="slick-button">Spotify Authorization</button>
        </div>
        <div class="flex-container">
            <h1>Current track</h1>

            <p id="currTrack">No song detected.</p>
            <button id="spotGetTrack" class="slick-button">Get Track</button>
        </div>
        <div id="unknownContainer" class="flex-container">
            <button id="getConfigs" class="slick-button">Get configs</button>
            <label for="configs">Select a config</label>
            <select name="configs" id="configs">
                <!--Options for configs will show up here-->
            </select>
            <button id="loadConfig" class="slick-button">Load config</button>
            <button id="getScrobble" class="slick-button">Get last.fm song</button>
        </div>
    </div>
</body>
</html>
